name: Scalp Hamrah Android Preview
on:
  push:
    branches: [main]
    paths: ['ScalpHamrah/**', '.github/workflows/scalp-hamrah-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scalp-hamrah-preview
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the reviewed source
        run: |
          cd ScalpHamrah
          sha256sum -c source.sha256
          unzip -q source.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare universal Python dependencies
        working-directory: ScalpHamrah/src
        run: |
          python -m pip install -r requirements-mobile.lock pytest==9.1.1 PyYAML==6.0.2
          python prepare_wheels.py
      - name: Test engine, manual mode and history audit offline
        working-directory: ScalpHamrah/src
        run: |
          set -o pipefail
          python -m pytest -q engine/tests | tee engine-tests.txt
          python -m pytest -q mobile-runtime/test_mobile.py audit/test_month_audit.py | tee mobile-tests.txt
      - name: Build APK, lint and unit tests
        working-directory: ScalpHamrah/src/android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android 15 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            cd ScalpHamrah/src/android && ./gradlew --no-daemon connectedDebugAndroidTest
            adb install -r ScalpHamrah/src/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.lordxau.mobile/.MainActivity
            sleep 3
            adb exec-out screencap -p > ScalpHamrah/src/android-preview.png
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-hamrah-build-evidence
          path: |
            ScalpHamrah/src/*tests.txt
            ScalpHamrah/src/android/app/build/reports/
            ScalpHamrah/src/android/app/build/outputs/androidTest-results/
            ScalpHamrah/src/android-preview.png
          retention-days: 30
      - name: Publish downloadable preview only after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ScalpHamrah/downloads
          cp ScalpHamrah/src/android/app/build/outputs/apk/debug/app-debug.apk ScalpHamrah/downloads/ScalpHamrah-0.1.0-preview.apk
          cp ScalpHamrah/source.zip ScalpHamrah/downloads/ScalpHamrah-source.zip
          cp ScalpHamrah/src/RELEASE_NOTES_FA.md ScalpHamrah/downloads/
          cp ScalpHamrah/src/android-preview.png ScalpHamrah/downloads/
          printf 'Commit: %s\nAndroid smoke: API35 x86_64 offline\nBroker login/trades: NOT tested\n' "$GITHUB_SHA" > ScalpHamrah/downloads/VALIDATION.txt
          cat ScalpHamrah/src/engine-tests.txt ScalpHamrah/src/mobile-tests.txt >> ScalpHamrah/downloads/VALIDATION.txt
          cd ScalpHamrah/downloads
          sha256sum *.apk *.zip > SHA256SUMS.txt
          gh release create "scalp-hamrah-preview-0.1.0-${GITHUB_RUN_NUMBER}" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'اسکالپ همراه 0.1.0 — پیش‌نمایش اندروید' --notes-file RELEASE_NOTES_FA.md
