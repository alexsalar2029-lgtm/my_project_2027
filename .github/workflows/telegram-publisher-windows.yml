name: Telegram Publisher Windows
on:
  push:
    branches: [telegram-publisher-v2]
    paths: ['TelegramPublisher/src/**', '.github/workflows/telegram-publisher-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: TelegramPublisher/src
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install tested Qt and build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test queue, media routing and calendar
        run: python -m unittest discover -v
      - name: Build single Windows EXE with runtime libraries
        run: python build_windows.py
      - name: Run the built EXE and test Qt, GUI and encrypted storage
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'windows-selftest.json'
          $process = Start-Process -FilePath '.\dist\TelegramPublisher.exe' -ArgumentList @('--self-test', $report) -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'EXE self-test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE did not start successfully' }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.ok -or -not $result.qt_loaded -or -not $result.dpapi) { throw 'EXE self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramPublisher-Windows-x64
          path: |
            TelegramPublisher/src/dist/TelegramPublisher.exe
            TelegramPublisher/src/windows-selftest.json
            TelegramPublisher/src/windows-selftest.png
          retention-days: 30
      - name: Publish the tested EXE and its verification report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash '.\dist\TelegramPublisher.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  TelegramPublisher.exe" | Set-Content -Encoding ascii TelegramPublisher.sha256
          $tag = 'telegram-publisher-v2.0.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Telegram Publisher 2.0.0 - Windows x64' --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag '.\dist\TelegramPublisher.exe' 'TelegramPublisher.sha256' 'windows-selftest.json' 'windows-selftest.png' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
